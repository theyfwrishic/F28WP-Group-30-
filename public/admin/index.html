<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Food Advisor Admin</title><link rel="stylesheet" href="/shared.css"></head><body><header id="nav"></header><main id="app"></main><div id="toast" role="status"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script><script src="/shared.js"></script><script>
const {esc,stars}=FA;let T='r';
FA.start('admin','Admin',render);
function render(){
 const head=`<h1>Admin</h1><div class="row">${[['r','Restaurants'],['v','Reviews'],['u','Users']].map(t=>`<button class="tab ${T==t[0]?'':'ghost'}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>`;
 if(T=='r')$.when(FA.api('GET','/restaurants'),FA.api('GET','/admin/owners')).done((a,o)=>{a=a[0];o=o[0];
  $('#app').html(head+`<h3>Add a restaurant</h3><form class="card wide" id="nf">${FA.fields()}<label>Owner</label><select name="owner">${o.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><p><button>Add restaurant</button></p></form><h3>All restaurants (${a.length})</h3>`+a.map(r=>`<div class="card row" style="margin-bottom:10px"><div><b>${esc(r.name)}</b><div class="mu">${esc(r.cuisine)} · ${esc(r.location)} · ${FA.rate(r)}</div></div><button class="del dres" data-id="${r.id}" style="margin-left:auto">Delete</button></div>`).join(''));
  $('#nf').submit(e=>{e.preventDefault();FA.api('POST','/restaurants',FA.form(e.target)).done(()=>{FA.toast('Restaurant added');render()})})});
 else if(T=='v')FA.api('GET','/admin/reviews').done(v=>$('#app').html(head+`<h3>All reviews (${v.length})</h3>`+(v.map(x=>`<div class="card" style="margin-bottom:10px"><div class="mu">${esc(x.restaurant||'Removed restaurant')}</div><div class="row"><b>${esc(x.author)}</b><span class="st">${stars(x.stars)}</span><button class="del dr" data-id="${x.id}" style="margin-left:auto">Delete</button></div><div>${esc(x.text)}</div></div>`).join('')||'<p class="mu">No reviews.</p>')));
 else FA.api('GET','/admin/users').done(c=>{$('#app').html(head+`<h3>Add a user</h3><form class="card form" id="uf"><label>Full name</label><input name="name" required><label>Username</label><input name="u" required><label>Password</label><input name="p" type="password" required><label>Role</label><select name="role"><option value="owner">Restaurant owner</option><option value="customer">Customer</option></select><p><button>Create user</button></p></form><h3>Registered users (${c.length})</h3><div class="scroll card"><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Activity</th><th></th></tr>${c.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.u)}</td><td>${u.role}</td><td>${u.n} ${u.role=='owner'?'restaurants':'reviews'}</td><td><button class="ghost upw" data-id="${u.id}">Reset password</button> <button class="del udel" data-id="${u.id}">Delete</button></td></tr>`).join('')}</table></div>`);
  $('#uf').submit(e=>{e.preventDefault();FA.api('POST','/admin/users',FA.form(e.target)).done(()=>{FA.toast('User created');render()})})})}
$(document).on('click','.tab',function(){T=$(this).data('t');render()})
.on('click','.dres',function(){confirm('Delete this restaurant and its reviews?')&&FA.api('DELETE','/restaurants/'+$(this).data('id')).done(()=>{FA.toast('Restaurant deleted');render()})})
.on('click','.dr',function(){confirm('Delete this review?')&&FA.api('DELETE','/reviews/'+$(this).data('id')).done(()=>{FA.toast('Review deleted');render()})});
$(document).on('click','.udel',function(){confirm('Delete this user and their reviews?')&&FA.api('DELETE','/admin/users/'+$(this).data('id')).done(()=>{FA.toast('User deleted');render()})}).on('click','.upw',function(){const p=prompt('New password (4+ characters)');p&&FA.api('PUT','/admin/users/'+$(this).data('id'),{p}).done(()=>FA.toast('Password reset'))});
</script></body></html>
