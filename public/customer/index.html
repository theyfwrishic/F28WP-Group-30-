<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Food Advisor Customer</title><link rel="stylesheet" href="/shared.css"></head><body><header id="nav"></header><main id="app"></main><div id="toast" role="status"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script><script src="/shared.js"></script><script>
const {esc,stars,rate}=FA;let F=JSON.parse(localStorage.getItem('fa_filters')||'null')||{q:'',c:'',l:'',p:'',r:''};
FA.start('customer','Customer',home,1);
function home(){FA.api('GET','/restaurants').done(a=>{
 const cs=[...new Set(a.map(r=>r.cuisine))].sort(),ls=[...new Set(a.map(r=>r.location))].sort(),o=(x,v)=>'<option value="">Any</option>'+x.map(y=>`<option ${y==v?'selected':''}>${esc(y)}</option>`).join('');
 $('#app').html(`<div class="row"><h1 style="margin-right:auto">Find your next meal</h1><button class="ghost" id="pf">My profile</button></div><p class="mu">Search by cuisine, location, price and rating, then read what other diners think.</p><div class="bar"><input class="f" name="q" placeholder="Search restaurants or dishes" aria-label="Search" value="${esc(F.q)}"><select class="f" name="c" aria-label="Cuisine">${o(cs,F.c)}</select><select class="f" name="l" aria-label="Location">${o(ls,F.l)}</select><select class="f" name="p" aria-label="Price"><option value="">Any price</option>${[1,2,3].map(n=>`<option value="${n}" ${F.p==n?'selected':''}>${'$'.repeat(n)}</option>`).join('')}</select><select class="f" name="r" aria-label="Rating"><option value="">Any rating</option>${[3,4,5].map(n=>`<option value="${n}" ${F.r==n?'selected':''}>${n}+ stars</option>`).join('')}</select></div><div id="g" class="grid"></div>`);grid()})}
function grid(){FA.api('GET','/restaurants?'+$.param(F)).done(a=>$('#g').html(a.map(r=>`<div class="card link" tabindex="0" data-id="${r.id}"><h3 style="margin-top:0">${esc(r.name)}</h3><p class="mu">${esc(r.cuisine)} · ${esc(r.location)} · ${'$'.repeat(r.price)}</p><p>${rate(r)}</p><p class="mu">${esc(r.desc)}</p></div>`).join('')||'<p class="mu">No restaurants match. Try clearing a filter.</p>'))}
$(document).on('input change','.f',function(){F[this.name]=this.value;localStorage.setItem('fa_filters',JSON.stringify(F));grid()}).on('click keydown','.card.link',function(e){if(e.type=='click'||e.key=='Enter')detail($(this).data('id'))});
function detail(id){FA.api('GET','/restaurants/'+id).done(r=>{const my=r.reviews.find(x=>x.uid==FA.user.id);
 $('#app').html(`<button class="ghost" id="bk">Back to results</button><div class="card" style="margin-top:12px"><h2>${esc(r.name)}</h2><p class="mu">${esc(r.cuisine)} · ${esc(r.location)} · ${'$'.repeat(r.price)}</p><p>${rate(r)}</p><p>${esc(r.desc)}</p></div>
 <h3>Menu and dishes</h3><div class="grid">${r.dishes.map(d=>`<div class="card"><b>${esc(d.n)}</b> <span class="mu">AED ${esc(d.p)}</span><p class="mu" style="margin:4px 0 0">${esc(d.d)}</p></div>`).join('')||'<p class="mu">No dishes listed yet.</p>'}</div>
 <h3>Reviews (${r.reviews.length})</h3><form class="card form" id="rf"><b>${my?'Edit your review':'Write a review'}</b><label>Rating</label><select name="stars">${[5,4,3,2,1].map(n=>`<option value="${n}" ${my&&my.stars==n?'selected':''}>${n} star${n>1?'s':''}</option>`).join('')}</select><label>Your review</label><textarea name="text" rows="3" required>${my?esc(my.text):esc(localStorage.getItem('fa_draft_'+id)||'')}</textarea><p><button>${my?'Save changes':'Post review'}</button> ${my?'<button type="button" class="del" id="dr">Delete my review</button>':''}</p></form>
 ${r.reviews.map(x=>`<div class="rev"><b>${esc(x.author)}</b> <span class="st">${stars(x.stars)}</span><div>${esc(x.text)}</div></div>`).join('')||'<p class="mu">No reviews yet. Be the first.</p>'}`);
 $('#bk').click(home);$('#rf textarea').on('input',function(){if(!my)localStorage.setItem('fa_draft_'+id,this.value)});
 $('#rf').submit(e=>{e.preventDefault();FA.api('POST','/restaurants/'+id+'/reviews',FA.form(e.target)).done(()=>{localStorage.removeItem('fa_draft_'+id);FA.toast('Review saved');detail(id)})});
 $('#dr').click(()=>confirm('Delete your review?')&&FA.api('DELETE','/reviews/'+my.id).done(()=>{FA.toast('Review deleted');detail(id)}))})}

$(document).on('click','#pf',profile);
function profile(){FA.api('GET','/profile').done(p=>{
 $('#app').html(`<button class="ghost" id="bk">Back to results</button><h2>My profile</h2><form class="card form" id="pf2"><label>Name</label><input name="name" required value="${esc(p.name)}"><label>Username</label><input value="${esc(p.u)}" disabled><label>Current password (only needed to change it)</label><input name="current" type="password" autocomplete="current-password"><label>New password</label><input name="p" type="password" autocomplete="new-password"><p><button>Save profile</button></p></form><h3>My reviews (${p.reviews.length})</h3>${p.reviews.map(x=>`<div class="rev"><a href="#" class="lk" data-id="${x.rid}">${esc(x.restaurant)}</a> <span class="st">${stars(x.stars)}</span><div>${esc(x.text)}</div></div>`).join('')||'<p class="mu">You have not reviewed anything yet.</p>'}`);
 $('#bk').click(home);
 $('#pf2').submit(e=>{e.preventDefault();FA.api('PUT','/profile',FA.form(e.target)).done(u=>{FA.user=u;FA.shell();FA.toast('Profile saved');profile()})});
 $('.lk').click(function(e){e.preventDefault();detail($(this).data('id'))})})}
</script></body></html>
